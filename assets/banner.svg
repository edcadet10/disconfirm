<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="disconfirm — research and falsify before you conclude. A Claude Code skill.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#11161f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ecca3"/>
      <stop offset="0.55" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.80" cy="0.22" r="0.65">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="0.92" r="0.6">
      <stop offset="0" stop-color="#4ecca3" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#4ecca3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect width="1280" height="320" fill="url(#glow2)"/>

  <!-- thin top accent rule -->
  <rect x="90" y="78" width="120" height="4" rx="2" fill="url(#accent)"/>

  <text x="88" y="186" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="108" font-weight="800" letter-spacing="-4" fill="url(#accent)">disconfirm</text>

  <text x="94" y="236" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="30" font-weight="500" fill="#9aa4b2">research + falsify before you conclude</text>

  <text x="94" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="17" fill="#5b6573">a claude code skill &#183; forced via a UserPromptSubmit hook</text>

  <!-- motif: a belief you'd accept (faint check), cut by a falsifying stroke -->
  <g transform="translate(1080,160)">
    <circle r="76" fill="none" stroke="#222b38" stroke-width="3"/>
    <circle r="76" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"
            stroke-dasharray="330 999" transform="rotate(-90)"/>
    <path d="M-42,2 l19,23 l46,-55" fill="none" stroke="#4ecca3" stroke-width="8"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.30"/>
    <line x1="-66" y1="52" x2="60" y2="-58" stroke="#7c5cff" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
